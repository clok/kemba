name: goreleaser

on:
  push:
    tags:
      - '*'

env:
  GO_VERSION: "1.16"

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5.1.0
        with:
          version: latest
          args: release --rm-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}